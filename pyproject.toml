[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "merestone"
version = "0.3.0"
description = "Operational AI security playbook: boundary-based assessment of AI systems (offline, standard library only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
merestone = "merestone:main"

[tool.setuptools]
# Install in editable mode (pip install -e .): the CLI reads the catalog, schemas and
# templates from this folder, so a regular (non-editable) install is not supported.
py-modules = ["merestone", "operational", "governance", "jsonutil", "fieldguide"]
packages = ["adapters"]
