<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Merestone</title>
<style>
:root{--bg:#FFFFFF;--side:#F7F7F5;--surface:#FFFFFF;--surface2:#F7F7F5;--ink:#1A1F1D;--muted:#5E6662;--faint:#6F7873;--line:#E4E6E2;--line2:#EFF0EE;
--accent:#0F6A62;--accent-ink:#FFFFFF;--accent-s:#EAF3F1;--sel:#F2F5F4;--stone:#A8701C;
--fail:#C2453C;--pass:#2F8150;--unk:#B0791E;--todo:#9AA19D;--ex:#6F6A86;--na:#B7BDB9;
--f:-apple-system,"Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121615;--side:#0E1211;--surface:#121615;--surface2:#181D1C;--ink:#E3E8E6;--muted:#9AA5A0;--faint:#8F9B95;--line:#262D2B;--line2:#1C2221;
--accent:#5CC2B3;--accent-ink:#0E1211;--accent-s:#16302B;--sel:#18211F;--stone:#D9A050;--fail:#E3786F;--pass:#6BBF8A;--unk:#D7A04F;--todo:#68726E;--ex:#ADA7C9;--na:#4A5350;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121615;--side:#0E1211;--surface:#121615;--surface2:#181D1C;--ink:#E3E8E6;--muted:#9AA5A0;--faint:#8F9B95;--line:#262D2B;--line2:#1C2221;
--accent:#5CC2B3;--accent-ink:#0E1211;--accent-s:#16302B;--sel:#18211F;--stone:#D9A050;--fail:#E3786F;--pass:#6BBF8A;--unk:#D7A04F;--todo:#68726E;--ex:#ADA7C9;--na:#4A5350;color-scheme:dark}
*{box-sizing:border-box}
/* Shared report mark supplied by the server uses these three palette names. */
.brand .mark{--teal:var(--accent);--sand:var(--surface2);--ochre:var(--stone)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--f);-webkit-font-smoothing:antialiased}
code,.mono{font-family:var(--mono);font-size:12.5px}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;line-height:1.3;letter-spacing:-.01em}
h1{font-size:20px;font-weight:600}h2{font-size:16px;font-weight:600}h3{font-size:14px;font-weight:600}h4{font-size:12.5px;font-weight:600;color:var(--ink)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sr:focus{position:fixed;top:8px;left:8px;width:auto;height:auto;clip:auto;padding:10px;background:var(--surface);z-index:100}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.stack{display:grid;gap:14px}.stack-s{display:grid;gap:6px}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100vh}
.app.has-detail{grid-template-columns:220px minmax(0,1fr) 520px}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:16px 20px 12px}
.brand .mark{width:13px;height:18px}
.wsn{padding:0 20px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.wsn b{display:block;color:var(--ink);font-weight:500;font-size:13px}
.nav{padding:10px 10px 4px;display:grid;gap:1px}
.nav button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--muted);cursor:pointer;text-align:left}
.nav button:hover{background:var(--sel);color:var(--ink)}.nav button[aria-current=page]{background:var(--line2);color:var(--ink);font-weight:500}
.nav .n{font-size:12px;color:var(--faint);font-weight:400}
.pend-h{display:flex;justify-content:space-between;padding:14px 20px 4px;font-size:12px;color:var(--muted)}
.pend{list-style:none;margin:0;padding:0 10px;display:grid;gap:1px}
.pend li{display:grid;grid-template-columns:8px 1fr;gap:8px;align-items:baseline;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.pend li:hover{background:var(--sel)}
.pend li i{width:6px;height:6px;border-radius:50%;background:var(--todo);transform:translateY(-1px)}
.pend li.block i{background:var(--fail)}.pend li.warn i{background:var(--unk)}.pend li.go i{background:var(--accent)}
.pend li span{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:1px}
.pend .cli{display:none;font:11px var(--mono);color:var(--accent);word-break:break-word;grid-column:2}
body.show-cli .pend .cli{display:block}
.allclear{margin:4px 20px;color:var(--pass);font-size:12.5px}
.more-p{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:4px 20px;text-align:left}
.status{margin-top:auto;border-top:1px solid var(--line);padding:14px 20px 10px;font-size:12.5px;color:var(--muted)}
.status .code{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:13px;margin-bottom:4px}
.status .code i{width:8px;height:8px;border-radius:50%;background:var(--unk)}
.status .code.c0 i{background:var(--pass)}.status .code.c1 i{background:var(--fail)}
.progress{height:3px;background:var(--line2);border-radius:2px;margin:8px 0 6px;display:flex;overflow:hidden}.progress i{display:block;height:100%}
.tools{display:flex;gap:4px;padding:6px 14px 14px;align-items:center}
.ibtn{border:1px solid transparent;background:none;height:28px;min-width:28px;border-radius:6px;cursor:pointer;display:inline-grid;place-items:center;padding:0 7px;color:var(--muted);font-size:12.5px;grid-auto-flow:column;gap:5px}
.ibtn:hover{background:var(--sel);color:var(--ink)}.ibtn svg{width:15px;height:15px}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);padding:0 20px 12px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--pass);display:block}.sync.busy i{background:var(--unk);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
main{min-width:0;overflow:auto;height:100vh}
.page{padding:22px 32px 80px;max-width:1080px}
.mbar{display:none}
@media (max-width:1180px){.app.has-detail{grid-template-columns:220px minmax(0,1fr)}.detail{position:fixed;right:0;top:0;bottom:0;width:min(560px,100vw);z-index:41;box-shadow:-20px 0 50px rgba(0,0,0,.18)}.scrim.on{opacity:1;pointer-events:auto}}
@media (max-width:820px){.app,.app.has-detail{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:45;transform:translateX(-100%);transition:transform .18s}
 body.side-open .side{transform:none;box-shadow:20px 0 50px rgba(0,0,0,.2)}
 .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 14px;font-weight:600}
 .mbar .st{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}.mbar .st i{width:7px;height:7px;border-radius:50%;background:var(--unk)}
 .page{padding:16px 16px 80px}}
.scrim{position:fixed;inset:0;background:rgba(10,14,13,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}

/* ---------- generic ---------- */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;margin-bottom:4px;flex-wrap:wrap}
.ph p{color:var(--muted);font-size:12.5px;margin-top:2px}
.card{border-top:1px solid var(--line);padding:26px 0}
.card:first-child{border-top:0;padding-top:6px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.card-h p{color:var(--muted);font-size:13px;margin-top:3px;max-width:72ch}
.eyebrow{font-size:12px;color:var(--faint);display:block;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding:4px 6px}.btn.ghost:hover{background:var(--sel)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip.pass{color:var(--pass)}.chip.fail{color:var(--fail)}.chip.unk{color:var(--unk)}.chip.teal{color:var(--accent)}.chip.todo{color:var(--muted)}
.chip+.chip::before{content:"·";color:var(--faint);margin-right:4px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--todo)}
.b-FAIL::before{background:var(--fail)}.b-PASS::before{background:var(--pass)}.b-UNKNOWN::before{background:var(--unk)}.b-EXCLUDED::before{background:var(--ex)}.b-NOT_APPLICABLE::before{background:var(--na)}
.b-FAIL{color:var(--fail)}.b-PASS{color:var(--pass)}
.f{display:grid;gap:4px;font-size:12px;color:var(--muted);align-content:start}
.f .hint{color:var(--faint);font-size:11.5px}
input[type=text],input[type=number],input[type=search],select{min-height:32px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;color:var(--ink);font-size:13.5px}
textarea{min-height:58px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg.nowrap{flex-wrap:nowrap}
.seg button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}.check input{margin-top:3px;accent-color:var(--accent)}
.note{border-left:2px solid var(--line);padding:6px 0 6px 12px;font-size:13px;color:var(--muted)}
.note b{color:var(--ink);font-weight:500}
.note.warn{border-color:var(--unk)}.note.bad{border-color:var(--fail)}.note.ok{border-color:var(--pass)}
.empty{padding:60px 0;max-width:560px}.empty h2{margin-bottom:6px}
hr.sep{border:0;border-top:1px solid var(--line2);margin:16px 0}
.kbd{font:500 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface2)}

/* ---------- architecture ---------- */
.ahead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}
.ahead .inl{border:1px solid transparent;border-radius:6px;padding:2px 6px;margin-left:-7px;background:none;font:600 20px var(--f);letter-spacing:-.01em;width:100%;min-height:0}
.ahead .inl:hover{border-color:var(--line)}
.steps{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;border-bottom:1px solid var(--line)}
.step{display:flex;align-items:center;gap:7px;border:0;background:none;padding:0 0 9px;cursor:pointer;font-size:13px;color:var(--muted)}
.step:hover{color:var(--ink)}
.step i{font-style:normal;font-size:11.5px;color:var(--faint)}
.step.ok i{color:var(--pass)}.step.bad i{color:var(--fail)}
.rtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.map{border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;background:var(--surface)}
.map svg{display:block;margin:0 auto;max-width:100%;height:auto}
.map .node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.map .node.actor rect{stroke:var(--ink)}
.map .node.ghost rect{stroke-dasharray:4 4}
.map .node text{fill:var(--ink);font:500 12.5px var(--f)}.map .node .sub{fill:var(--faint);font:400 10.5px var(--mono)}
.map .flow{stroke:var(--accent);stroke-width:1.6;fill:none}
.map .packet{fill:var(--accent)}
.map .stone{cursor:pointer}
.map .stone polygon{fill:var(--stone);stroke:var(--stone);stroke-width:1}
.map .stone text{fill:var(--bg);font:600 10px var(--mono);pointer-events:none}
.map .stone:hover polygon,.map .stone.on polygon{fill:var(--ink);stroke:var(--ink)}
.map .stone:focus{outline:none}
.map .lbl{fill:var(--faint);font:10.5px var(--mono)}
.stone-detail{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:13px;color:var(--muted)}
.stone-detail p{flex:1;min-width:240px}
.stone-detail .tag{font:500 12px var(--mono);color:var(--ink);white-space:nowrap}
.hops{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hop{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:1px 1px 1px 8px;background:var(--surface)}
.hop input{border:0!important;background:none;padding:3px 2px;width:auto;min-width:60px;min-height:0;font-size:13px;box-shadow:none!important}
.hop button{border:0;background:none;color:var(--faint);cursor:pointer;padding:2px 6px;font-size:14px;border-radius:4px}.hop button:hover{color:var(--fail)}
.hops .arrow{color:var(--faint)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:6px;padding:8px 11px;cursor:pointer;background:var(--surface);text-align:left}
.opt b{display:block;font-size:13px;font-weight:500}.opt span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.opt:hover{border-color:var(--faint)}
.opt[aria-pressed=true]{border-color:var(--ink);background:var(--sel)}
.fields{display:grid}
.fld{display:grid;grid-template-columns:16px minmax(170px,230px) 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line2)}
.fld:first-child{border-top:0}
.fld .st{width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--fail)}
.fld .st.ok{background:var(--pass)}.fld .st.opt{background:var(--na)}.fld .st{font-size:0}
.fld b{font-size:13px;font-weight:500;display:block}.fld p{font-size:12px;color:var(--muted)}
.fld .ctl{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.fld .ctl > input{flex:1;min-width:180px}
.fld.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{background:var(--accent-s)}100%{background:none}}
@media (max-width:760px){.fld{grid-template-columns:16px 1fr}.fld .ctl{grid-column:2}}
.limits{display:grid;grid-template-columns:repeat(5,minmax(80px,1fr));gap:8px;flex:1}
.limits label{font-size:11.5px;color:var(--muted);display:grid;gap:3px}
@media (max-width:760px){.limits{grid-template-columns:repeat(2,1fr)}}
.stops{display:grid;gap:6px;flex:1}
.stops .s{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line2);padding:3px 0;font-size:13px}.stops .s span{flex:1}
.capbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.capgroup{margin-top:16px}.capgroup h4{margin-bottom:4px;display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--line)}
.capgroup h4 span:last-child{font-weight:400;color:var(--faint)}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));column-gap:28px}
.cap{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)}
.cap .k{font:11.5px var(--mono);color:var(--faint)}.cap .l{font-size:13px;line-height:1.3}
.cap .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cap .src{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cap .src.miss{color:var(--fail)}
.tri{display:inline-grid;grid-template-columns:repeat(3,26px);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tri button{border:0;border-left:1px solid var(--line);background:var(--surface);height:24px;cursor:pointer;font:600 11.5px var(--mono);color:var(--faint)}
.tri button:first-child{border-left:0}.tri button:hover{color:var(--ink)}
.tri button[aria-pressed=true].a{background:var(--muted);color:var(--bg)}.tri button[aria-pressed=true].u{background:var(--unk);color:#fff}.tri button[aria-pressed=true].p{background:var(--pass);color:#fff}
.qs{display:grid}
.q{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.q b{font-size:13.5px;font-weight:500}.q .k{font:11px var(--mono);color:var(--faint);margin-top:1px}
@media (max-width:760px){.q{grid-template-columns:1fr}}
.protos{display:grid}
.proto{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line2)}
.proto .v{display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:2px}
.preview{display:grid;gap:8px}
.pv{display:grid;grid-template-columns:90px 1fr 260px;gap:12px;align-items:center;font-size:12.5px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line2)}.bar i{display:block;height:100%}
@media (max-width:760px){.pv{grid-template-columns:70px 1fr}.pv .c{grid-column:1/-1}}
.chipsin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface)}
.chipsin .chip{border:1px solid var(--line);border-radius:4px;padding:1px 2px 1px 7px;color:var(--ink);font-size:12.5px}
.chipsin .chip+.chip::before{content:none}
.chipsin .chip button{border:0;background:none;color:var(--faint);cursor:pointer;padding:0 4px}
.chipsin input{border:0!important;background:none!important;box-shadow:none!important;flex:1;min-width:120px;padding:3px;min-height:0}
.sugg{display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:6px}.sugg button{border:0;background:none;padding:0;font-size:12px;cursor:pointer;color:var(--accent)}

/* ---------- plan list ---------- */
.ltabs{display:flex;gap:18px;align-items:flex-end;border-bottom:1px solid var(--line);margin-top:14px;flex-wrap:wrap}
.ltabs button{border:0;background:none;padding:0 0 9px;color:var(--muted);cursor:pointer;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.ltabs button[aria-pressed=true]{color:var(--ink);border-color:var(--ink);font-weight:500}
.ltabs button span{color:var(--faint);margin-left:4px;font-size:12px;font-weight:400}
.ph .filters{display:flex;gap:8px;flex-wrap:wrap}
.ph .filters select{width:auto;min-height:28px;padding:3px 8px;font-size:12.5px}.ph .filters input{width:190px;min-height:28px;padding:3px 9px;font-size:12.5px}
table.lst{width:100%;border-collapse:collapse}
.lst td{padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
.lst td:first-child{padding-left:4px;width:16px}
.lst td i.d{display:block;width:7px;height:7px;border-radius:50%;background:var(--todo)}
.lst .FAIL i.d{background:var(--fail)}.lst .PASS i.d{background:var(--pass)}.lst .UNKNOWN i.d{background:var(--unk)}.lst .NOT_APPLICABLE i.d{background:var(--na)}.lst .EXCLUDED i.d{background:var(--ex)}
.lst .id{font:12px var(--mono);color:var(--muted);width:160px}
.lst .tt{width:100%;white-space:normal}.lst .m{color:var(--muted);font-size:12.5px}.lst .r{text-align:right;padding-right:4px;color:var(--muted);font-size:12.5px}
.lst .r.ready{color:var(--accent);font-weight:500}.lst .r.warn{color:var(--unk)}
.lst tr.t{cursor:pointer}.lst tr.t:hover td{background:var(--sel)}
.lst tr.sel td{background:var(--sel)}.lst tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}

.mini{display:inline-flex;gap:2px;vertical-align:middle;margin-left:8px}.mini i{width:8px;height:3px;border-radius:1px;background:var(--line)}.mini i.ok{background:var(--pass)}.mini i.f{background:var(--fail)}.mini i.st{background:var(--unk)}

/* ---------- detail pane ---------- */

.app.has-detail .detail{display:flex}

.fc h3,.fc h4,.fc h5,.fc h6{margin:16px 0 6px;color:var(--ink)}.fc h3{font-size:16px}.fc h4{font-size:14px}.fc h5{font-size:13px}
.fc p,.fc li{font-size:13px}.fc ul,.fc ol{padding-left:20px;margin:6px 0}.fc pre{background:var(--surface2);border:1px solid var(--line);padding:10px;border-radius:6px;overflow:auto;font:12px var(--mono);white-space:pre-wrap}

.sample .dots{display:flex;gap:3px}.sample .dots i{width:10px;height:10px;border-radius:2px;border:1px solid var(--line)}
.sample .dots i.PASS{background:var(--pass);border-color:var(--pass)}.sample .dots i.FAIL{background:var(--fail);border-color:var(--fail)}.sample .dots i.st{outline:1.5px solid var(--unk);outline-offset:1px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}

.tw{overflow-x:auto}

.ev .k .req{font:400 10.5px var(--f);color:var(--fail)}.ev.has .k .req{color:var(--pass)}.ev .k .req.o{color:var(--faint)}
.ev .body{display:grid;gap:4px;min-width:0}

.ev .file b{font-weight:500;word-break:break-all}.ev .file .hash{font:11px var(--mono);color:var(--pass)}
.ev .file button{border:0;background:none;color:var(--faint);cursor:pointer;font-size:12px;padding:0;margin-left:auto}.ev .file button:hover{color:var(--fail)}

.checklist span.ok{color:var(--pass)}

.trial .h b{font:12px var(--mono);font-weight:400}

/* ---------- modal, toast, welcome, activity ---------- */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px}

.modal .box .mh{padding:18px 20px 4px}.modal .box .mb{padding:10px 20px 20px;display:grid;gap:14px}
.layouts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lay{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;background:var(--surface);text-align:left}
.lay[aria-pressed=true]{border-color:var(--ink);background:var(--sel)}

.toast i{width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--pass)}.toast.err i{background:var(--fail)}.toast.warn i{background:var(--unk)}
.toast b{font-weight:500}.toast pre{margin:4px 0 0;font:11.5px var(--mono);white-space:pre-wrap;opacity:.7;max-height:120px;overflow:auto}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.packet{display:none}}

<body>
<a class="sr" href="#main">Skip to content</a>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigation, pending work and status"></aside>
  <main id="main" tabindex="-1"></main>
  <aside class="detail" id="drawer" aria-labelledby="dtitle"></aside>
</div>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="filepick" hidden>
<script nonce="__NONCE__">
'use strict';
/* ================= basics ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('merestone.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('merestone.'+k,JSON.stringify(v))}catch(e){}}};
let S=null, ST=null;                       // static catalog data, workspace state
const FC={};                               // fieldcard cache
const F={};                                // form values, by namespace
const UI={view:store.get('view','arch'),route:0,drawer:null,dtab:'work',capMode:store.get('capMode','interview'),capQ:'',q:'',module:'',activity:'',ltab:'all',stone:0,allPend:false,busy:0,offline:false,theme:store.get('theme','system'),lastSync:Date.now()};
const PLACEHOLDER='to be identified';
const ICON={
  arch:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><path d="M7.5 12h9"/><path d="M12 7l2.5 2-1 3h-3l-1-3z" fill="currentColor"/></svg>',
  plan:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>',
  log:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
};
const fmtBytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const when=iso=>{const d=new Date(iso);if(isNaN(d))return esc(iso);const s=(Date.now()-d)/1000;
  const rel=s<60?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago';
  return `<span title="${esc(d.toLocaleString())}">${rel}</span>`;};
const capSource=()=>String(getF('caps.source',store.get('capsource','')||(ST&&ST.arch?ST.arch.inventory_review.evidence_ref:'')||'')).trim();
const vague=s=>!String(s||'').trim()||String(s).toLowerCase().includes(PLACEHOLDER);

/* ================= form state ================= */
function ns(name,init){if(!F[name])F[name]=typeof init==='function'?init():(init||{});return F[name];}
function getF(path,d=''){const i=path.indexOf('.');const n=path.slice(0,i),k=path.slice(i+1);return F[n]&&F[n][k]!==undefined?F[n][k]:d;}
function setF(path,v){const i=path.indexOf('.');const n=path.slice(0,i),k=path.slice(i+1);ns(n)[k]=v;}
const bind=(path,extra='')=>`data-bind="${esc(path)}" id="b-${esc(path)}" ${extra}`;
const val=(path,d='')=>esc(getF(path,d));

/* ================= server ================= */
async function api(path,body){
  const opt={headers:{'X-Merestone':'1'},credentials:'same-origin',cache:'no-store'};
  if(body!==undefined){opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  let r;try{r=await fetch('/api/'+path,opt);}catch(e){setOffline(true);throw Object.assign(new Error('The local Merestone server is not running.'),{hint:'Start it again with: merestone ui'});}
  setOffline(false);
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{hint:j.hint||''});
  return j;
}
async function act(action,body,okTitle){
  busy(1);
  try{const res=await api(action,body);await refresh();const lines=(res.output||'').split('\n').filter(Boolean);
    toast(okTitle||lines[0]||'Saved.',okTitle?lines.join('\n'):lines.slice(1).join('\n'),'ok');return res;}
  catch(e){toast(e.message,e.hint,'err');return null;}
  finally{busy(-1);}
}
async function refresh(){ST=await api('state');UI.lastSync=Date.now();render();}
function busy(d){UI.busy+=d;renderSync();}
function setOffline(v){if(UI.offline!==v){UI.offline=v;renderSync();}}

/* ================= toasts ================= */
function toast(title,detail,kind='ok'){
  const el=document.createElement('div');el.className='toast '+(kind==='err'?'err':kind==='warn'?'warn':'');
  el.innerHTML=`<i></i><div><b>${esc(title)}</b>${detail?`<pre>${esc(detail)}</pre>`:''}</div><button type="button" aria-label="Dismiss">×</button>`;
  el.querySelector('button').onclick=()=>el.remove();
  $('#toasts').append(el);setTimeout(()=>el.remove(),kind==='err'?12000:5000);
}

/* ================= helpers on the model ================= */
const plan=()=>ST&&ST.plan, tasks=()=>(ST&&ST.plan?ST.plan.tasks:[]);
const findTask=a=>tasks().find(t=>t.alias===a);
const routeOf=id=>ST.arch.routes.find(r=>r.id===id);
function applies(rule,caps){let unc=false;for(const cl of rule){const v=cl.map(k=>caps[k]||'unknown');if(v.every(x=>x==='present'))return'APPLICABLE';if(!v.includes('absent'))unc=true;}return unc?'UNKNOWN':'NOT_APPLICABLE';}
function sample(t){
  const pr=t.test_protocol;if(!pr)return null;
  const staged=(t.staged&&t.staged.trials)||[];
  const trials=[...t.trials.map(x=>({...x,_st:false})),...staged.map(x=>({...x,_st:true}))];
  const rows=pr.required_variants.map(v=>({v,need:pr.min_trials_per_variant,got:trials.filter(x=>x.variant===v&&x.execution==='COMPLETED'&&(x.result==='PASS'||x.result==='FAIL'))}));
  const complete=rows.every(r=>r.got.length>=r.need), anyFail=trials.some(x=>x.result==='FAIL');
  return {rows,complete,anyFail,trials,staged,ready:staged.length>0&&(complete||staged.some(x=>x.result==='FAIL'))};
}
function code(){return ST&&ST.check?ST.check.exit_code:2;}
function counts(){const c={FAIL:0,TODO:0,UNKNOWN:0,PASS:0,EXCLUDED:0,NOT_APPLICABLE:0};tasks().forEach(t=>c[t.bucket]++);return c;}
function missingSources(r){return Object.entries(r.capabilities).filter(([k,v])=>v!=='unknown'&&!String(r.capability_evidence[k]||'').trim()).map(([k])=>k);}
function hops(boundary){return vague(boundary)?[]:String(boundary).split(/\s*(?:->|→|=>)\s*/).map(s=>s.trim()).filter(Boolean);}
function blockedAccess(t){return t.access==='unknown'||t.access==='none'||t.scope!=='in_scope';}
const accessLabel=t=>t.scope!=='in_scope'?'Out of scope':t.access==='none'?'No access':'Access unknown';
function unsavedArchitecture(){
  if(!ST||!ST.arch)return [];
  const a=ST.arch, pending=[];
  a.routes.forEach(r=>{if(routeDirty(r))pending.push({label:'Route '+r.id,target:'sec-route',route:r.id});});
  const values={authorization:a.authorization_ref,snapshot:a.snapshot_ref,'evidence-store':a.evidence_store,reviewer:a.inventory_review.reviewer,'inventory-evidence':a.inventory_review.evidence_ref,owner:(a.assets[0]||{}).owner||'',stop:''};
  Object.entries(values).forEach(([k,v])=>{if(String(getF('rd.'+k,v))!==String(v))pending.push({label:S.items[k]?.label||'Asset owner',target:'fld-'+k});});
  if(Object.keys(a.limits).some(k=>String(getF('lim.'+k,a.limits[k]))!==String(a.limits[k])))pending.push({label:'Load limits',target:'fld-limits'});
  a.routes.forEach(r=>{const f=F['proto:'+r.id];if(!f||!f.case)return;
    const p=(r.test_protocols||[]).find(p=>p.case_id===f.case);
    if(!p||f.variants.join()!==p.required_variants.join()||+f.min!==p.min_trials_per_variant||f.design!==p.design||f.rule!==p.decision_rule||f.why!==p.justification)pending.push({label:'Protocol '+f.case,target:'sec-proto',route:r.id});});
  return pending;
}

/* ================= render: frame ================= */
function render(){
  const a=document.activeElement, binding=a?.dataset?.bind, id=a?.id;
  const attrs=a?.dataset&&(a.dataset.act||a.dataset.filter)?{...a.dataset}:null;
  let sel=null;try{sel=a&&'selectionStart' in a?[a.selectionStart,a.selectionEnd]:null;}catch(e){}
  renderSide();renderMain();renderDrawer();
  const b=binding?$$('[data-bind]').find(x=>x.dataset.bind===binding):id?document.getElementById(id):attrs?$$('[data-act], [data-filter]').find(x=>Object.entries(attrs).every(([k,v])=>x.dataset[k]===v)):null;
  if(b&&b!==document.activeElement){b.focus({preventScroll:true});try{if(sel)b.setSelectionRange(sel[0],sel[1]);}catch(e){}}
}
const STATUS_LBL={FAIL:'Failed',TODO:'To do',UNKNOWN:'Unknown',PASS:'Passed',EXCLUDED:'Excluded',NOT_APPLICABLE:'Not applicable'};
function renderSide(){
  const w=ST.workspace, n=counts(), p=plan(), c=code();
  const tools=`<div class="tools"><button class="ibtn" data-act="theme" type="button" title="Theme: ${UI.theme} (T)">${ICON[UI.theme==='light'?'sun':UI.theme==='dark'?'moon':'auto']}</button>
    <button class="ibtn" data-act="help" type="button" title="Keyboard shortcuts (?)">?</button><span class="grow"></span>
    ${p?`<button class="ibtn" data-act="export" type="button" title="Export the report (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Report</button>`:''}</div>`;
  const brand=`<div class="brand">${S.mark.replace('class="mark"','class="mark"')}Merestone</div>`;
  if(!w){$('#side').innerHTML=brand+`<div class="wsn"><b>No workspace open</b>Create or open one to begin.</div><div class="status">Everything stays on this computer.</div><div class="sync"></div>${tools}`;renderSync();return;}
  const navs=[['arch','Architecture',!w.has_plan&&ST.setup_items.length?ST.setup_items.length:''],['plan','Plan',w.has_plan?n.TODO+n.FAIL:''],['log','Activity','']];
  const L=pending(), shown=UI.allPend?L:L.slice(0,5);
  const app=tasks().filter(t=>t.applicability==='APPLICABLE'&&!t.exclusion).length||1, dec=n.PASS+n.FAIL;
  $('#side').innerHTML=brand+`<div class="wsn"><b>${esc(ST.arch.system_name)}</b>${esc(w.name)} · ${esc(w.series||'no plan yet')}</div>
   <nav class="nav" aria-label="Views">${navs.map(([k,l,cnt])=>`<button type="button" data-act="view" data-v="${k}" ${UI.view===k?'aria-current="page"':''}>${l}<span class="n">${cnt}</span></button>`).join('')}</nav>
   <div class="pend-h"><span>Pending</span><span>${L.length}</span></div>
   ${L.length?`<ul class="pend">${shown.map((x,i)=>`<li class="${x.lv}" role="button" tabindex="0" data-act="pend" data-i="${i}" title="${esc(x.d)}"><i></i><div>${esc(x.t)}</div><div class="cli">$ ${esc(x.cli)}</div></li>`).join('')}</ul>
   ${L.length>5?`<button type="button" class="more-p" data-act="allPend">${UI.allPend?'Show fewer':'Show all '+L.length}</button>`:''}`:'<p class="allclear">Nothing pending.</p>'}
   <div class="status"><div class="code c${p?c:2}"><i></i>${p?`Exit code ${c} · ${esc(S.code_meta[c][0].replace('Complete, ','').replace('Incomplete or unverified','Incomplete'))}`:'No plan yet'}</div>
   ${p?`${dec} of ${app} applicable decided<div class="progress"><i style="width:${100*n.PASS/app}%;background:var(--pass)"></i><i style="width:${100*n.FAIL/app}%;background:var(--fail)"></i></div>`:'<span>Freeze the plan to start testing.</span>'}
   <label class="check tiny" style="margin-top:8px"><input type="checkbox" data-act="cliToggle" ${document.body.classList.contains('show-cli')?'checked':''}> Show terminal commands</label></div>
   <div class="sync"></div>${tools}`;
  UI._pend=shown;renderSync();
}

function steps(){
  const a=ST.arch, rs=a.routes, p=plan(), gaps=ST.readiness.filter(g=>!g.includes(':evidence:')&&g!=='core_design_missing');
  const routeOk=rs.every(r=>!['unknown','none'].includes(r.access)&&!vague(r.actor)&&!vague(r.boundary));
  const unk=rs.reduce((n,r)=>n+Object.values(r.capabilities).filter(v=>v==='unknown').length,0), miss=rs.reduce((n,r)=>n+missingSources(r).length,0);
  const np=rs.reduce((n,r)=>n+(r.test_protocols||[]).length,0);
  return [['sec-route','Route',routeOk?'ok':'bad',routeOk?'✓':'!',routeOk?'complete':'actor, components or access missing'],['sec-ready','Before testing',gaps.length?'bad':'ok',gaps.length||'✓',gaps.length?gaps.length+' missing':'complete'],
    ['sec-caps','Capabilities',miss?'bad':unk?'':'ok',miss?'!':unk?unk:'✓',miss?miss+' answers without a source':unk?unk+' unknown':'complete'],['sec-proto','Protocols',np?'ok':'',np,np+' defined'],['sec-freeze','Plan',p&&!p.stale?'ok':p?'bad':'',p&&!p.stale?'✓':p?'!':'–',p&&!p.stale?'frozen':p?'revision pending':'not frozen yet']];
}
/* ---------- route map ---------- */
const rbase=r=>({actor:vague(r.actor)?'':r.actor,hops:hops(r.boundary),access:r.access,activities:[...r.activity_types],scope:r.scope});
const rsame=(f,b)=>(f.actor||'')===b.actor&&f.hops.map(x=>x.trim()).filter(Boolean).join(' -> ')===b.hops.join(' -> ')&&f.access===b.access&&f.activities.join()===b.activities.join()&&f.scope===b.scope;
function rform(r){const n='route:'+r.id,b=rbase(r),key=JSON.stringify(b);
  if(F[n]&&F[n]._key!==key&&rsame(F[n],JSON.parse(F[n]._key)))delete F[n];   // changed elsewhere (e.g. the terminal) and not edited here
  return ns(n,()=>({...JSON.parse(key),_key:key}));}
function routeDirty(r){return !rsame(rform(r),rbase(r));}

    <div class="hops">${f.hops.map((h,i)=>`${i?'<span class="arrow">→</span>':''}<span class="hop"><input type="text" ${bind(n+'.hop'+i)} value="${esc(h)}" size="${Math.max(6,h.length)}" aria-label="Component ${i+1}"><button type="button" data-act="hopDel" data-route="${esc(id)}" data-i="${i}" aria-label="Remove">×</button></span>`).join('')}

    ${f.access==='unknown'||f.access==='none'?'<p class="small" style="color:var(--fail);margin-top:4px">Tasks cannot be completed while access is unknown or unavailable.</p>':''}</div>

   <div id="fld-scope" class="stack-s"><div class="row"><span id="scope-label" class="small muted" style="font-weight:600">Assessment scope</span><div class="seg" role="group" aria-labelledby="scope-label">${['in_scope','out_of_scope'].map(x=>`<button type="button" data-act="rset" data-route="${esc(id)}" data-k="scope" data-val="${x}" aria-pressed="${f.scope===x}">${x==='in_scope'?'In scope':'Out of scope'}</button>`).join('')}</div></div><p class="small muted">${f.scope==='in_scope'?'This route is included in the assessment.':'Tasks on this route cannot be completed. Changing scope does not count as passing or remove pending obligations.'} Save the route to apply this choice.</p></div>

function mapSvg(f){
  const nodes=[{t:'Actor',s:f.actor||'who acts?',cls:'actor'}];
  if(f.hops.length)f.hops.forEach((h,i)=>nodes.push({t:h,s:i===f.hops.length-1?'final effect':'component '+(i+1)}));
  else nodes.push({t:'?',s:'describe the route',cls:'ghost'},{t:'?',s:'final effect',cls:'ghost'});
  const W=140,G=66,H=50,y=50,n=nodes.length,width=Math.max(720,40+n*W+(n-1)*G);
  const x=i=>20+i*(W+G);const cut=(s,m)=>s.length>m?s.slice(0,m-1)+'…':s;
  const flow=`M${x(0)+W} ${y+H/2} H${x(n-1)}`;
  let svg=`<svg viewBox="0 0 ${width} 140" width="${width}" style="min-width:${Math.min(width,560)}px" role="group" aria-label="Route diagram"><path id="flowp" class="flow" d="${flow}"/>`;
  if(f.hops.length)svg+=`<circle class="packet" r="6"><animateMotion dur="${2+n*0.8}s" repeatCount="indefinite"><mpath href="#flowp"/></animateMotion></circle>`;
  nodes.forEach((d,i)=>{svg+=`<g class="node ${d.cls||''}"><title>${esc(d.t)} · ${esc(d.s)}</title><rect x="${x(i)}" y="${y}" width="${W}" height="${H}" rx="9"/><text x="${x(i)+W/2}" y="${y+21}" text-anchor="middle">${esc(cut(d.t,17))}</text><text class="sub" x="${x(i)+W/2}" y="${y+38}" text-anchor="middle">${esc(cut(d.s,21))}</text></g>`;});
  for(let i=0;i<n-1;i++){const cx=x(i)+W+G/2,cy=y+H/2;
    svg+=`<g class="stone ${UI.stone===i?'on':''}" tabindex="0" role="button" data-stone="${i}" aria-label="Boundary ${i+1}"><polygon points="${cx},${cy-16} ${cx+14},${cy-6} ${cx+9},${cy+14} ${cx-9},${cy+14} ${cx-14},${cy-6}"/><text x="${cx}" y="${cy+5}" text-anchor="middle">${i+1}</text></g>`;}
  svg+=`<text class="lbl" x="${x(0)+W/2}" y="${y+H+28}" text-anchor="middle">origin</text><text class="lbl" x="${x(n-1)+W/2}" y="${y+H+28}" text-anchor="middle">effect → decides the result</text></svg>`;
  return svg;
}
function wireMap(){
  const show=i=>{UI.stone=i;$$('#map .stone').forEach(g=>g.classList.toggle('on',+g.dataset.stone===i));
    const r=ST.arch.routes[UI.route],f=rform(r);const names=['Actor',...(f.hops.length?f.hops:['?','?'])];
    const d=$('#stoneDetail');if(!d)return;
    d.innerHTML=`<span class="tag">Boundary ${i+1} · ${esc(names[i])} → ${esc(names[i+1])}</span><p class="muted">Trust changes here. Ask: can something that crosses from <b>${esc(names[i])}</b> into <b>${esc(names[i+1])}</b> make it do what the actor is not allowed to? The planned tasks of this route inherit this description.</p>`;};
  $$('#map .stone').forEach(g=>{g.addEventListener('click',()=>show(+g.dataset.stone));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(+g.dataset.stone);}});});
  const n=$$('#map .stone').length;show(Math.min(UI.stone,Math.max(0,n-1)));
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){try{$('#map svg').pauseAnimations();}catch(e){}}
}

/* ---------- protocols ---------- */
const DESIGN_INFO={deterministic:'Same input, same result. One trial per variant is usually enough.',
  'stochastic-fixed':'Outputs vary between runs: fix the number of trials per variant before running.',
  'adaptive-exploration':'Exploratory red teaming: every attempt is recorded, including the failed ones.'};
function protoForm(r,caseId,compact){
  const f=ns('proto:'+r.id,()=>({case:caseId||'',variants:['original','benign'],min:1,design:'deterministic',rule:'',why:''}));

function todoRank(t){const s=sample(t);if(blockedAccess(t))return 6;if(s&&s.ready)return 0;if(t.staged)return 1;if(s)return 2;if(t.activity==='DESIGN'||t.activity==='CONFIG')return 3;return 4;}

function rowHint(t){

function pending(){
  const L=[], w=ST.workspace, p=plan(), cli=s=>s;
  if(!w)return L;
  if(!p){
    ST.setup_items.forEach(i=>L.push({lv:i.blocking?'block':'warn',t:S.items[i.key].label+(i.route?' ('+i.route+')':''),d:S.items[i.key].why,go:['arch',fieldFor(i.key)],route:i.route,cli:i.command}));
    if(!ST.setup_items.some(i=>i.blocking))L.push({lv:'go',t:'Freeze the plan',d:'Turn the architecture into a fixed list of obligations.',go:['arch','sec-freeze'],cli:'merestone plan'});
    return L;}
  if(ST.integrity_error)L.push({lv:'block',t:'The plan does not verify',d:ST.integrity_error,go:['log',null],cli:'merestone doctor'});
  if(p.stale)L.push({lv:'warn',t:'Freeze a revision',d:'The architecture changed after '+w.series+' was frozen.',go:['arch','sec-freeze'],cli:'merestone plan --reason "..." --approver "..."'});
  const gaps=ST.check?ST.check.readiness_gaps:[];
  gaps.forEach(g=>{const cap=g.includes(':evidence:');L.push({lv:'block',t:cap?'Source missing: '+g.split(':evidence:')[1]:(S.gap_label[g]||g),d:'Readiness gap in the frozen plan: fix it, then freeze a revision.',go:['arch',cap?'fld-caps-source':fieldFor(gapKey(g))],cli:cap?'merestone caps NAME=STATE --source "..."':'merestone status'});});
  p.routes.filter(r=>r.access==='unknown'||r.access==='none').forEach(r=>L.push({lv:'block',t:'Access unknown on '+r.id,d:'Tasks cannot complete while access is unknown.',go:['arch','fld-access'],cli:'merestone set access gray-box --route '+r.id}));
  const ts=tasks();
  ts.filter(t=>{const s=sample(t);return s&&s.ready&&!t.result;}).forEach(t=>L.push({lv:'go',t:'Decide '+t.alias,d:t.title+': staged trials are ready.',task:t.alias,cli:`merestone decide ${t.alias} --reviewer "..." --observations "..." --cleanup-confirmed`}));
  ts.filter(t=>t.staged&&!t.result&&!(sample(t)||{}).ready).forEach(t=>L.push({lv:'info',t:'Finish the sample of '+t.alias,d:'Staged trials wait for the rest of the planned sample.',task:t.alias,cli:'merestone show '+t.alias}));
  const unk=ts.filter(t=>t.bucket==='UNKNOWN').length;
  if(unk)L.push({lv:'warn',t:unk+' tasks pending confirmation',d:'They depend on capabilities nobody has verified.',go:['arch','sec-caps'],cli:'merestone caps'});
  const todo=ts.filter(t=>t.bucket==='TODO'&&!blockedAccess(t));
  const np=todo.filter(t=>(t.activity==='TEST'||t.activity==='REDTEAM')&&!t.test_protocol);
  if(np.length)L.push({lv:'warn',t:np.length+' tests without a protocol',d:'e.g. '+np[0].alias+'. Needed to decide PASS or FAIL.',task:np[0].alias,cli:'merestone protocol '+np[0].case_id+' --variants ... --rule ... --why ...'});
  const rv=todo.filter(t=>t.activity==='DESIGN'||t.activity==='CONFIG');
  if(rv.length)L.push({lv:'info',t:rv.length+(rv.length===1?' review':' reviews')+' to do',d:'Next: '+rv[0].alias+' · '+rv[0].title,task:rv[0].alias,cli:'merestone show '+rv[0].alias});
  const rt=todo.filter(t=>t.test_protocol&&!t.staged);
  if(rt.length)L.push({lv:'info',t:rt.length+(rt.length===1?' test':' tests')+' ready to run',d:'Next: '+rt[0].alias+' · '+rt[0].title,task:rt[0].alias,cli:'merestone show '+rt[0].alias});
  ts.filter(t=>t.result==='FAIL').forEach(t=>L.push({lv:'info',t:'Document the finding for '+t.alias,d:'Use templates/finding-v3.json; include it in the report with --findings.',task:t.alias,cli:'python governance.py check-finding ...'}));
  if(code()!==2)L.push({lv:'go',t:'Export the final report',d:'Everything selected is resolved.',exp:true,cli:'merestone report --format both'});
  else L.push({lv:'info',t:'Share progress',d:'Export the report for people who do not use the terminal.',exp:true,cli:'merestone report --format html --open'});
  return L;
}

    store.set('reviewer',f.reviewer);const r=await act('decide',{task:t.alias,reviewer:f.reviewer,observations:f.observations,cleanup_confirmed:true,inconclusive:!!f.inconclusive});if(r){delete F[n];delete F['rec:'+t.alias];render();}},

    store.set('reviewer',f.reviewer);const r=await act('review',{task:t.alias,result:f.result,reviewer:f.reviewer,observations:f.observations,collector:f.collector,...evPayload(n,kinds)});if(r){delete F[n];render();}},

    const target=html||md;if(win&&target)win.location.href='/reports/'+encodeURIComponent(target);else if(target)window.open('/reports/'+encodeURIComponent(target),'_blank','noopener');

/* ================= files: hashing and drag & drop ================= */
const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256js(buf){ // fallback when crypto.subtle is unavailable
  const b=new Uint8Array(buf),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=0x80;const dv=new DataView(m.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l/0x20000000));
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),w=new Uint32Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
    let [a,bb,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;}
    H[0]+=a;H[1]+=bb;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h;}
  return [...H].map(x=>x.toString(16).padStart(8,'0')).join('');}
async function sha256(buf){if(window.crypto&&crypto.subtle){const d=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');}return sha256js(buf);}
function b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
async function addFile(n,kind,file){
  if(file.size>40*1024*1024){toast(file.name+' is larger than 40 MB.','Store large captures elsewhere and record a short note or an extract that points to them.','err');return;}
  const f=ns(n);f.ev=f.ev||{};const pending={name:file.name,size:file.size};f.ev[kind]=pending;render();
  try{const buf=await file.arrayBuffer();const sha=await sha256(buf);if(f.ev[kind]===pending)f.ev[kind]={name:file.name,size:file.size,sha,data:b64(buf)};}
  catch(e){if(f.ev[kind]===pending)delete f.ev[kind];toast('Could not read '+file.name,e.message,'err');}
  render();
}
function guessKind(name,free,all){const low=name.toLowerCase();return all.find(k=>low.includes(k)&&free.includes(k))||free[0];}
document.addEventListener('dragover',e=>{e.preventDefault();const s=e.target.closest&&e.target.closest('.ev, .evgrid');$$('.drag').forEach(x=>{if(x!==s)x.classList.remove('drag');});if(s)s.classList.add('drag');});
document.addEventListener('dragleave',e=>{if(e.target.classList&&e.target.classList.contains('drag'))e.target.classList.remove('drag');});
document.addEventListener('drop',e=>{e.preventDefault();$$('.drag').forEach(x=>x.classList.remove('drag'));
  const files=[...(e.dataTransfer&&e.dataTransfer.files||[])];if(!files.length)return;
  const slot=e.target.closest&&e.target.closest('.ev'), grid=e.target.closest&&e.target.closest('.evgrid');
  if(slot&&files.length===1){addFile(slot.dataset.ns,slot.dataset.evslot,files[0]);return;}
  if(!grid&&!slot){toast('Drop evidence files on the evidence area of a trial or review.','','warn');return;}
  const n=(grid||slot.closest('.evgrid')).dataset.evgrid,f=ns(n);f.ev=f.ev||{};
  const all=$$('.ev',grid||slot.closest('.evgrid')).map(x=>x.dataset.evslot);
  for(const file of files){const free=all.filter(k=>!(f.ev[k])&&!String(getF(n+'.note_'+k,'')).trim());if(!free.length){toast('Every evidence slot is filled.','','warn');break;}
    const k=guessKind(file.name,free,all);addFile(n,k,file);}
});

/* ================= events ================= */
const MUTATIONS=new Set(['create','open','saveRoute','saveField','saveLimits','stopDel','cap','capq','capsSource','saveProto','freeze','record','decide','review','doExport']);
let writing=false;
async function dispatch(el,e){
  const fn=A[el.dataset.act];if(!fn||el.disabled)return;
  const writes=MUTATIONS.has(el.dataset.act)&&!(el.dataset.act==='open'&&el.dataset.task);
  if(writes&&writing){toast('A save is already in progress.','Wait for it to finish, then try again.','warn');return;}
  if(writes)writing=true;
  try{await fn(el,e);}catch(err){toast(err.message,err.hint,'err');}finally{if(writes)writing=false;}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(!(el.tagName==='INPUT'&&el.type==='checkbox'))e.preventDefault();dispatch(el,e);});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.bind){setF(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);
    const m=el.dataset.bind.match(/^(route:[^.]+)\.hop(\d+)$/);if(m){F[m[1]].hops[+m[2]]=el.value;}
    if(el.tagName==='SELECT'||el.type==='checkbox'||/\.(variant|reachability|case|design)$/.test(el.dataset.bind)||m||/^(rd|lim|freeze|route:[^.]+|proto:[^.]+)\./.test(el.dataset.bind)||/\.note_/.test(el.dataset.bind)||/^(rec|dec|rev):/.test(el.dataset.bind))schedule();
    return;}
  if(el.dataset.filter){UI[el.dataset.filter]=el.value;schedule();}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.filter){UI[el.dataset.filter]=el.value;render();}});
let tm=null;function schedule(){clearTimeout(tm);tm=setTimeout(render,120);}
document.addEventListener('keydown',e=>{
  const el=e.target, typing=el.matches&&el.matches('input,textarea,select');
  if($('#modal').classList.contains('on')){
    if(e.key==='Escape'){e.preventDefault();closeModal();return;}
    if(e.key==='Tab'){const items=$$('#modal .box button:not([disabled]), #modal .box input, #modal .box a[href]');const first=items[0],last=items[items.length-1];if(e.shiftKey&&el===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&el===last){e.preventDefault();first?.focus();}}
    return;
  }
  if((e.key==='Enter'||e.key===' ')&&el.matches('li[data-act],tr[data-act]')){e.preventDefault();dispatch(el,e);return;}
  if(e.key==='Enter'&&el.dataset&&el.dataset.enter&&!e.shiftKey){e.preventDefault();dispatch({dataset:{...el.dataset,act:el.dataset.enter}},e);return;}
  if(e.key==='Enter'&&el.dataset&&el.dataset.save==='name'){e.preventDefault();el.blur();return;}
  if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else if(UI.drawer)closeDrawer();else document.body.classList.remove('side-open');$('#scrim').classList.remove('on');return;}
  if(el.dataset?.act==='dtab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['work','card','ev'],i=tabs.indexOf(UI.dtab);UI.dtab=e.key==='Home'?tabs[0]:e.key==='End'?tabs[2]:tabs[(i+(e.key==='ArrowRight'?1:2))%3];renderDrawer();return;}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'&&ST&&ST.workspace){e.preventDefault();if(UI.view!=='plan'){UI.view='plan';render();}const q=$('#boardq');if(q)q.focus();}
  else if(['1','2','3'].includes(e.key)&&ST&&ST.workspace){A.view({dataset:{v:['arch','plan','log'][+e.key-1]}});}
  else if(e.key==='e'||e.key==='E')A.export();else if(e.key==='t'||e.key==='T')A.theme();else if(e.key==='?')helpModal();else if(e.key==='p'||e.key==='P')A.rail();
});
document.addEventListener('focusout',async e=>{const el=e.target;if(el.dataset&&el.dataset.save==='name'){const v=el.value.trim();if(v&&v!==ST.arch.system_name){const r=await act('set',{field:'name',value:v},'System name saved');if(r)delete F.sys;}}});
function applyTheme(){const h=document.documentElement;if(UI.theme==='system')h.removeAttribute('data-theme');else h.dataset.theme=UI.theme;}

/* ================= start ================= */
(async function(){
  applyTheme();if(store.get('cli',false))document.body.classList.add('show-cli');
  try{S=await api('static');await refresh();}catch(e){$('#main').innerHTML=`<div class="empty"><h2>Could not load the workspace</h2><p>${esc(e.message)}</p><p class="small">${esc(e.hint||'')}</p></div>`;return;}
  setInterval(async()=>{if(document.hidden||UI.busy)return;try{const {rev}=await api('rev');if(ST&&rev!==ST.rev)await refresh();}catch(e){}},2500);
  setInterval(()=>{if(UI.view==='log'&&!document.hidden&&!UI.busy)renderMain();},60000);
})();
