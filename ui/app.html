<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Merestone</title>
<style>
:root{--bg:#EEF1EE;--surface:#FFFFFF;--surface2:#F6F8F6;--ink:#18221F;--muted:#56635E;--faint:#8A968F;--line:#CBD3CD;--line2:#E0E6E1;
--teal:#0F6A62;--teal-s:#D5EAE6;--teal-ink:#FFFFFF;--ochre:#A8701C;--sand:#F1E3C8;--stone:#A8701C;--stone-s:#F4E8D2;
--pass:#2D7A4B;--pass-s:#D8EDDF;--fail:#B03F37;--fail-s:#F5DCD9;--unk:#A8701C;--unk-s:#F1E3C8;--todo:#3F5C56;--todo-s:#DDE8E5;--na:#8A968F;--na-s:#E8ECE9;--ex:#6F6A86;--ex-s:#E6E4EE;
--night:#0E1513;--night2:#16211E;--night-ink:#E4ECE8;--night-muted:#9BABA5;--shadow:0 1px 2px rgba(14,21,19,.06),0 6px 20px rgba(14,21,19,.06);--shadow-lg:0 20px 60px rgba(14,21,19,.25);
--r:12px;--f:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;--mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1614;--surface:#17211E;--surface2:#1C2724;--ink:#E4ECE8;--muted:#9BABA5;--faint:#6E7C76;--line:#2C3A36;--line2:#24312D;
--teal:#5CC2B3;--teal-s:#16332F;--teal-ink:#0E1513;--ochre:#D9A050;--sand:#3A2D18;--stone:#D9A050;--stone-s:#33281A;
--pass:#6CC48D;--pass-s:#1A3324;--fail:#E77B72;--fail-s:#3D1F1C;--unk:#D9A050;--unk-s:#3A2D18;--todo:#9FC9C1;--todo-s:#1E2D2A;--na:#7E8C86;--na-s:#1C2522;--ex:#ADA7C9;--ex-s:#25233A;
--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0F1614;--surface:#17211E;--surface2:#1C2724;--ink:#E4ECE8;--muted:#9BABA5;--faint:#6E7C76;--line:#2C3A36;--line2:#24312D;
--teal:#5CC2B3;--teal-s:#16332F;--teal-ink:#0E1513;--ochre:#D9A050;--sand:#3A2D18;--stone:#D9A050;--stone-s:#33281A;
--pass:#6CC48D;--pass-s:#1A3324;--fail:#E77B72;--fail-s:#3D1F1C;--unk:#D9A050;--unk-s:#3A2D18;--todo:#9FC9C1;--todo-s:#1E2D2A;--na:#7E8C86;--na-s:#1C2522;--ex:#ADA7C9;--ex-s:#25233A;
--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f)}
body{min-height:100vh}
code,.mono{font-family:var(--mono);font-size:.92em}
a{color:var(--teal)}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em;line-height:1.25}
h2{font-size:19px}h3{font-size:16px}h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.stack{display:grid;gap:12px}.stack-s{display:grid;gap:6px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--night);color:var(--night-ink);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:0 18px;height:58px;border-bottom:1px solid #000}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{flex:none}.brand .mark polygon:nth-child(2){fill:#18221F}.brand .mark polygon:nth-child(3){stroke:#E4ECE8}
.brand b{font-size:17px;letter-spacing:-.02em}.brand .ws{color:var(--night-muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28vw}
nav.tabs{display:flex;gap:4px;justify-self:center}
nav.tabs button{background:none;border:0;color:var(--night-muted);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:flex;gap:7px;align-items:center}
nav.tabs button:hover{color:var(--night-ink);background:var(--night2)}
nav.tabs button[aria-current=page]{color:var(--night-ink);background:#22302C;box-shadow:inset 0 -2px 0 #5CC2B3}
nav.tabs .n{font-size:11px;background:#2C3A36;border-radius:20px;padding:1px 7px;color:#C9D5D0}
.tools{display:flex;gap:8px;align-items:center}
.ibtn{background:var(--night2);border:1px solid #2A3833;color:var(--night-ink);height:34px;min-width:34px;border-radius:9px;cursor:pointer;display:inline-grid;place-items:center;padding:0 10px;font-weight:600;gap:6px;grid-auto-flow:column}
.ibtn:hover{border-color:#5CC2B3}
.ibtn svg{width:16px;height:16px}
.sem{display:flex;align-items:center;gap:8px;background:#0A100E;border:1px solid #2A3833;border-radius:30px;padding:4px 12px 4px 6px;cursor:pointer;color:var(--night-ink)}
.sem .lights{display:flex;gap:4px;background:#000;border-radius:20px;padding:4px 6px}
.sem .lights i{width:11px;height:11px;border-radius:50%;background:#26302D;display:block}
.sem .lights i.on.g{background:#4FBF7A;box-shadow:0 0 8px #4FBF7A}.sem .lights i.on.r{background:#E2564B;box-shadow:0 0 8px #E2564B}.sem .lights i.on.a{background:#E0A64E;box-shadow:0 0 8px #E0A64E}
.sem b{font:700 15px var(--mono)}.sem span{font-size:12.5px;color:var(--night-muted);white-space:nowrap}
.railbtn{display:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:calc(100vh - 58px)}
main{padding:22px 26px 80px;min-width:0}
.rail{border-left:1px solid var(--line);background:var(--surface2);position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;padding:18px 16px 30px}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);margin-top:14px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--pass);display:block}
.sync.busy i{background:var(--ochre);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:1100px){.shell{grid-template-columns:1fr}.rail{position:fixed;right:0;top:58px;width:min(380px,100vw);z-index:25;transform:translateX(100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
 body.rail-open .rail{transform:none}.railbtn{display:inline-grid}}
@media (max-width:520px){.brand b{display:none}}
@media (max-width:760px){main .ahead{grid-template-columns:1fr}main .ahead .inl{font-size:21px}main .ahead h1{font-size:21px}}
@media (max-width:760px){.top{grid-template-columns:auto auto;height:auto;padding:8px 12px;gap:8px}nav.tabs{grid-column:1/-1;order:3;justify-self:stretch;overflow-x:auto}.brand .ws{display:none}
 .sem span{display:none}main{padding:16px 14px 80px}.top .tools .lbl{display:none}.shell{min-height:auto}.rail{top:104px;height:calc(100vh - 104px)}}

/* ---------- rail ---------- */
.mood{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.mood .mojo{display:block}
.mood .code{font:800 30px/1 var(--mono)}.mood .code.c0{color:var(--pass)}.mood .code.c1{color:var(--fail)}.mood .code.c2{color:var(--ochre)}
.mood p{font-size:12.5px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:17px;line-height:1.2}.stat span{font-size:10.5px;color:var(--muted)}
.progress{height:8px;border-radius:6px;background:var(--na-s);display:flex;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%}
.pend-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.pend{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pend li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:9px 11px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
.pend li > .cli{grid-column:1/-1}
.pend li.block{border-left-color:var(--fail)}.pend li.warn{border-left-color:var(--ochre)}.pend li.go{border-left-color:var(--teal)}.pend li.info{border-left-color:var(--na)}
.pend b{display:block;font-size:13.5px}.pend p{font-size:12.5px;color:var(--muted);margin-top:2px}
.pend .cli{display:none;font:11.5px var(--mono);color:var(--teal);margin-top:5px;word-break:break-word}
body.show-cli .pend .cli{display:block}
.pend .act{grid-row:1;grid-column:2}
.allclear{background:var(--pass-s);color:var(--pass);border-radius:10px;padding:10px 12px;font-weight:600;font-size:13px}

/* ---------- generic components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h p{color:var(--muted);font-size:13px;margin-top:3px;max-width:75ch}
.eyebrow{font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ochre)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--fail);border-color:var(--fail);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--teal);padding:5px 8px}.btn.ghost:hover{background:var(--teal-s)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:15px;height:15px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:600;background:var(--na-s);color:var(--muted);white-space:nowrap}
.chip.teal{background:var(--teal-s);color:var(--teal)}.chip.pass{background:var(--pass-s);color:var(--pass)}.chip.fail{background:var(--fail-s);color:var(--fail)}
.chip.unk{background:var(--unk-s);color:var(--unk)}.chip.todo{background:var(--todo-s);color:var(--todo)}.chip.ex{background:var(--ex-s);color:var(--ex)}
.badge{font:700 11px var(--mono);letter-spacing:.04em;padding:3px 8px;border-radius:6px}
.b-FAIL{background:var(--fail);color:#fff}.b-PASS{background:var(--pass);color:#fff}.b-TODO{background:var(--todo-s);color:var(--todo)}.b-UNKNOWN{background:var(--unk-s);color:var(--unk)}
.b-NOT_APPLICABLE{background:var(--na-s);color:var(--na)}.b-EXCLUDED{background:var(--ex-s);color:var(--ex)}
.f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);align-content:start}
.f .hint{font-weight:400;color:var(--faint)}
input[type=text],input[type=number],input[type=search],select{min-height:36px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font-size:14px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-s)}
input.bad,textarea.bad{border-color:var(--fail)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg.nowrap{flex-wrap:nowrap}.seg button{white-space:nowrap;border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button.r-PASS[aria-pressed=true]{background:var(--pass);color:#fff}.seg button.r-FAIL[aria-pressed=true]{background:var(--fail);color:#fff}.seg button.r-INCONCLUSIVE[aria-pressed=true]{background:var(--ochre);color:#fff}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}.check input{margin-top:3px;accent-color:var(--teal)}
.note{background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note.warn{background:var(--unk-s);border-color:transparent;color:var(--ink)}.note.bad{background:var(--fail-s);border-color:transparent;color:var(--ink)}.note.ok{background:var(--pass-s);border-color:transparent;color:var(--ink)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}.empty .mojo{margin:0 auto 10px;display:block}
hr.sep{border:0;border-top:1px dashed var(--line);margin:16px 0}
.kbd{font:600 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface2)}

/* ---------- architecture ---------- */
.ahead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.step{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface2);border-radius:20px;padding:4px 12px 4px 5px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink)}
.step:hover{border-color:var(--teal)}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 10.5px var(--mono);background:var(--unk-s);color:var(--unk)}
.step.ok i{background:var(--pass-s);color:var(--pass)}.step.bad i{background:var(--fail-s);color:var(--fail)}
.ahead h1{font-size:26px}
.ahead .inl{border:1px dashed transparent;border-radius:8px;padding:2px 6px;margin-left:-7px;background:none;font:700 26px var(--f);letter-spacing:-.02em;width:100%}
.ahead .inl:hover{border-color:var(--line)}.ahead .inl:focus{border-color:var(--teal);background:var(--surface2)}
.rtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.map{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:12px;overflow-x:auto}
.map svg{display:block;margin:0 auto;max-width:100%;height:auto}
.map .node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.map .node.actor rect{stroke:var(--teal);stroke-width:2}
.map .node.ghost rect{stroke-dasharray:5 4;fill:none}
.map .node text{fill:var(--ink);font:600 13px var(--f)}.map .node .sub{fill:var(--muted);font:400 10.5px var(--mono)}
.map .flow{stroke:var(--teal);stroke-width:2.4;fill:none}
.map .packet{fill:var(--teal)}
.map .stone{cursor:pointer}
.map .stone polygon{fill:var(--stone-s);stroke:var(--stone);stroke-width:2}
.map .stone text{fill:var(--stone);font:700 11px var(--mono);pointer-events:none}
.map .stone:hover polygon,.map .stone.on polygon{fill:var(--stone)}.map .stone:hover text,.map .stone.on text{fill:var(--surface)}
.map .stone:focus{outline:none}.map .stone:focus polygon{stroke-width:3}
.map .lbl{fill:var(--faint);font:10.5px var(--mono)}
.stone-detail{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:flex-start;font-size:13px}.stone-detail p{flex:1;min-width:240px}
.stone-detail .tag{font:600 11.5px var(--mono);background:var(--stone-s);color:var(--stone);padding:3px 9px;border-radius:6px;white-space:nowrap}
.hops{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hop{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:2px 2px 2px 8px}
.hop input{border:0;background:none;padding:4px 2px;width:auto;min-width:60px;font-size:13.5px;box-shadow:none!important}
.hop button{border:0;background:none;color:var(--faint);cursor:pointer;padding:2px 6px;font-size:15px;border-radius:6px}.hop button:hover{color:var(--fail);background:var(--fail-s)}
.hops .arrow{color:var(--stone);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;background:var(--surface);text-align:left}
.opt b{display:block;font-size:13.5px}.opt span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.opt[aria-pressed=true]{border-color:var(--teal);background:var(--teal-s);box-shadow:inset 0 0 0 1px var(--teal)}
.fields{display:grid;gap:2px}
.fld{display:grid;grid-template-columns:22px minmax(170px,240px) 1fr;gap:12px;align-items:start;padding:11px 4px;border-top:1px solid var(--line2)}
.fld:first-child{border-top:0}
.fld .st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:2px}
.fld .st.ok{background:var(--pass-s);color:var(--pass)}.fld .st.no{background:var(--fail-s);color:var(--fail)}.fld .st.opt{background:var(--na-s);color:var(--na)}
.fld b{font-size:13.5px;display:block}.fld p{font-size:12px;color:var(--muted)}
.fld .ctl{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.fld .ctl > input{flex:1;min-width:180px}
.fld.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{background:var(--teal-s)}100%{background:none}}
@media (max-width:760px){.fld{grid-template-columns:22px 1fr}.fld .ctl{grid-column:2}}
.limits{display:grid;grid-template-columns:repeat(5,minmax(80px,1fr));gap:8px;flex:1}
.limits label{font-size:11px;color:var(--muted);display:grid;gap:3px}
@media (max-width:760px){.limits{grid-template-columns:repeat(2,1fr)}}
.stops{display:grid;gap:6px;flex:1}
.stops .s{display:flex;gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:5px 6px 5px 10px;font-size:13.5px}
.stops .s span{flex:1}
.capbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.capgroup{margin-top:14px}.capgroup h4{margin-bottom:6px;display:flex;justify-content:space-between}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:6px}
.cap{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:7px 10px;background:var(--surface)}
.cap .k{font:11.5px var(--mono);color:var(--faint)}.cap .l{font-size:13.5px;font-weight:600;line-height:1.3}
.cap .meta{display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap}
.cap .src{font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap .src.miss{color:var(--fail);font-weight:600}
.tri{display:inline-grid;grid-template-columns:repeat(3,30px);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.tri button{border:0;background:none;border-radius:6px;height:24px;cursor:pointer;font:700 12px var(--mono);color:var(--faint)}
.tri button:hover{background:var(--line2)}
.tri button[aria-pressed=true].a{background:var(--na);color:#fff}.tri button[aria-pressed=true].u{background:var(--ochre);color:#fff}.tri button[aria-pressed=true].p{background:var(--pass);color:#fff}
.qs{display:grid;gap:8px}
.q{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.q b{font-size:14px;font-weight:600}.q .k{font:11px var(--mono);color:var(--faint);margin-top:2px}
.q .seg button[aria-pressed=true].yes{background:var(--pass);color:#fff}.q .seg button[aria-pressed=true].no{background:var(--na);color:#fff}.q .seg button[aria-pressed=true].dk{background:var(--ochre);color:#fff}
@media (max-width:760px){.q{grid-template-columns:1fr}}
.protos{display:grid;gap:8px}

<header class="top">
  <div class="brand"><span id="mark"></span><b>Merestone</b><span class="ws" id="wsname"></span></div>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <div class="tools">
    <button class="sem" id="sem" data-act="rail" type="button" title="Plan status (exit code of check-plan)"></button>
    <button class="ibtn" data-act="export" type="button" id="exportBtn" title="Export the report (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl">Report</span></button>
    <button class="ibtn railbtn" data-act="rail" type="button" title="Pending list">Pending</button>

    <button class="ibtn" data-act="help" type="button" title="Keyboard shortcuts (?)">?</button>
  </div>
</header>
<div class="shell"><main id="main" tabindex="-1"></main><aside class="rail" id="rail" aria-label="Status and pending work"></aside></div>

<input type="file" id="filepick" hidden>
<script nonce="__NONCE__">
'use strict';
/* ================= basics ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('merestone.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('merestone.'+k,JSON.stringify(v))}catch(e){}}};
let S=null, ST=null;                       // static catalog data, workspace state
const FC={};                               // fieldcard cache
const F={};                                // form values, by namespace
const UI={view:store.get('view','arch'),route:0,drawer:null,dtab:'work',capMode:store.get('capMode','interview'),capQ:'',q:'',module:'',activity:'',showNA:false,stone:0,allPend:false,busy:0,offline:false,theme:store.get('theme','system'),lastSync:Date.now()};
const PLACEHOLDER='to be identified';
const ICON={
  arch:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><path d="M7.5 12h9"/><path d="M12 7l2.5 2-1 3h-3l-1-3z" fill="currentColor"/></svg>',
  plan:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>',
  log:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
};
const fmtBytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const when=iso=>{const d=new Date(iso);if(isNaN(d))return esc(iso);const s=(Date.now()-d)/1000;
  const rel=s<60?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago';
  return `<span title="${esc(d.toLocaleString())}">${rel}</span>`;};
const capSource=()=>String(getF('caps.source',store.get('capsource','')||(ST&&ST.arch?ST.arch.inventory_review.evidence_ref:'')||'')).trim();
const vague=s=>!String(s||'').trim()||String(s).toLowerCase().includes(PLACEHOLDER);

/* ================= form state ================= */
function ns(name,init){if(!F[name])F[name]=typeof init==='function'?init():(init||{});return F[name];}
function getF(path,d=''){const i=path.indexOf('.');const n=path.slice(0,i),k=path.slice(i+1);return F[n]&&F[n][k]!==undefined?F[n][k]:d;}
function setF(path,v){const i=path.indexOf('.');const n=path.slice(0,i),k=path.slice(i+1);ns(n)[k]=v;}
const bind=(path,extra='')=>`data-bind="${esc(path)}" id="b-${esc(path)}" ${extra}`;
const val=(path,d='')=>esc(getF(path,d));

/* ================= server ================= */
async function api(path,body){
  const opt={headers:{'X-Merestone':'1'},credentials:'same-origin',cache:'no-store'};
  if(body!==undefined){opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  let r;try{r=await fetch('/api/'+path,opt);}catch(e){setOffline(true);throw Object.assign(new Error('The local Merestone server is not running.'),{hint:'Start it again with: merestone ui'});}
  setOffline(false);
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{hint:j.hint||''});
  return j;
}
async function act(action,body,okTitle){
  busy(1);
  try{const res=await api(action,body);await refresh();const lines=(res.output||'').split('\n').filter(Boolean);
    toast(okTitle||lines[0]||'Saved.',okTitle?lines.join('\n'):lines.slice(1).join('\n'),'ok');return res;}
  catch(e){toast(e.message,e.hint,'err');return null;}
  finally{busy(-1);}
}
async function refresh(){ST=await api('state');UI.lastSync=Date.now();render();}
function busy(d){UI.busy+=d;const s=$('.sync');if(s)s.classList.toggle('busy',UI.busy>0);}
function setOffline(v){if(UI.offline!==v){UI.offline=v;renderSync();}}

/* ================= toasts ================= */
function toast(title,detail,kind='ok'){
  const el=document.createElement('div');el.className='toast '+(kind==='err'?'err':kind==='warn'?'warn':'');
  el.innerHTML=`<i></i><div><b>${esc(title)}</b>${detail?`<pre>${esc(detail)}</pre>`:''}</div><button type="button" aria-label="Dismiss">×</button>`;
  el.querySelector('button').onclick=()=>el.remove();
  $('#toasts').append(el);setTimeout(()=>el.remove(),kind==='err'?12000:5000);
}

/* ================= helpers on the model ================= */
const plan=()=>ST&&ST.plan, tasks=()=>(ST&&ST.plan?ST.plan.tasks:[]);
const findTask=a=>tasks().find(t=>t.alias===a);
const routeOf=id=>ST.arch.routes.find(r=>r.id===id);
function applies(rule,caps){let unc=false;for(const cl of rule){const v=cl.map(k=>caps[k]||'unknown');if(v.every(x=>x==='present'))return'APPLICABLE';if(!v.includes('absent'))unc=true;}return unc?'UNKNOWN':'NOT_APPLICABLE';}
function sample(t){
  const pr=t.test_protocol;if(!pr)return null;
  const staged=(t.staged&&t.staged.trials)||[];
  const trials=[...t.trials.map(x=>({...x,_st:false})),...staged.map(x=>({...x,_st:true}))];
  const rows=pr.required_variants.map(v=>({v,need:pr.min_trials_per_variant,got:trials.filter(x=>x.variant===v&&x.execution==='COMPLETED'&&(x.result==='PASS'||x.result==='FAIL'))}));
  const complete=rows.every(r=>r.got.length>=r.need), anyFail=trials.some(x=>x.result==='FAIL');
  return {rows,complete,anyFail,trials,staged,ready:staged.length>0&&(complete||staged.some(x=>x.result==='FAIL'))};
}
function code(){return ST&&ST.check?ST.check.exit_code:2;}
function counts(){const c={FAIL:0,TODO:0,UNKNOWN:0,PASS:0,EXCLUDED:0,NOT_APPLICABLE:0};tasks().forEach(t=>c[t.bucket]++);return c;}
function missingSources(r){return Object.entries(r.capabilities).filter(([k,v])=>v!=='unknown'&&!String(r.capability_evidence[k]||'').trim()).map(([k])=>k);}
function hops(boundary){return vague(boundary)?[]:String(boundary).split(/\s*(?:->|→|=>)\s*/).map(s=>s.trim()).filter(Boolean);}
function blockedAccess(t){return t.access==='unknown'||t.access==='none'||t.scope!=='in_scope';}

/* ---------- route map ---------- */
const rbase=r=>({actor:vague(r.actor)?'':r.actor,hops:hops(r.boundary),access:r.access,activities:[...r.activity_types],scope:r.scope});
const rsame=(f,b)=>(f.actor||'')===b.actor&&f.hops.map(x=>x.trim()).filter(Boolean).join(' -> ')===b.hops.join(' -> ')&&f.access===b.access&&f.activities.join()===b.activities.join()&&f.scope===b.scope;
function rform(r){const n='route:'+r.id,b=rbase(r),key=JSON.stringify(b);
  if(F[n]&&F[n]._key!==key&&rsame(F[n],JSON.parse(F[n]._key)))delete F[n];   // changed elsewhere (e.g. the terminal) and not edited here
  return ns(n,()=>({...JSON.parse(key),_key:key}));}
function routeDirty(r){return !rsame(rform(r),rbase(r));}

function mapSvg(f){
  const nodes=[{t:'Actor',s:f.actor||'who acts?',cls:'actor'}];
  if(f.hops.length)f.hops.forEach((h,i)=>nodes.push({t:h,s:i===f.hops.length-1?'final effect':'component '+(i+1)}));
  else nodes.push({t:'?',s:'describe the route',cls:'ghost'},{t:'?',s:'final effect',cls:'ghost'});
  const W=140,G=66,H=50,y=50,n=nodes.length,width=Math.max(720,40+n*W+(n-1)*G);
  const x=i=>20+i*(W+G);const cut=(s,m)=>s.length>m?s.slice(0,m-1)+'…':s;
  const flow=`M${x(0)+W} ${y+H/2} H${x(n-1)}`;
  let svg=`<svg viewBox="0 0 ${width} 140" width="${width}" style="min-width:${Math.min(width,560)}px" role="group" aria-label="Route diagram"><path id="flowp" class="flow" d="${flow}"/>`;
  if(f.hops.length)svg+=`<circle class="packet" r="6"><animateMotion dur="${2+n*0.8}s" repeatCount="indefinite"><mpath href="#flowp"/></animateMotion></circle>`;
  nodes.forEach((d,i)=>{svg+=`<g class="node ${d.cls||''}"><title>${esc(d.t)} · ${esc(d.s)}</title><rect x="${x(i)}" y="${y}" width="${W}" height="${H}" rx="9"/><text x="${x(i)+W/2}" y="${y+21}" text-anchor="middle">${esc(cut(d.t,17))}</text><text class="sub" x="${x(i)+W/2}" y="${y+38}" text-anchor="middle">${esc(cut(d.s,21))}</text></g>`;});
  for(let i=0;i<n-1;i++){const cx=x(i)+W+G/2,cy=y+H/2;
    svg+=`<g class="stone ${UI.stone===i?'on':''}" tabindex="0" role="button" data-stone="${i}" aria-label="Boundary ${i+1}"><polygon points="${cx},${cy-16} ${cx+14},${cy-6} ${cx+9},${cy+14} ${cx-9},${cy+14} ${cx-14},${cy-6}"/><text x="${cx}" y="${cy+5}" text-anchor="middle">${i+1}</text></g>`;}
  svg+=`<text class="lbl" x="${x(0)+W/2}" y="${y+H+28}" text-anchor="middle">origin</text><text class="lbl" x="${x(n-1)+W/2}" y="${y+H+28}" text-anchor="middle">effect → decides the result</text></svg>`;
  return svg;
}

function protoForm(r,caseId,compact){

  const grp=a=>opts.filter(o=>o.a===a).map(o=>`<option value="${esc(o.c.id)}" ${o.c.id===f.case?'selected':''}>${esc(o.c.id)} · ${esc(o.c.title)}</option>`).join('');
  const sug=[...new Set(['original','neighbor','benign',...(c?c.variants:[])])].filter(v=>!f.variants.includes(v));

   ${c?`<p class="small muted">${esc(c.objective)}</p>`:''}
   <div class="f"><span class="small muted" style="font-weight:600">Variants that must be run</span><div class="chipsin">${f.variants.map((v,i)=>`<span class="chip">${esc(v)}<button type="button" data-act="varDel" data-ns="${esc(n)}" data-i="${i}" aria-label="Remove">×</button></span>`).join('')}
    <input type="text" ${bind(n+'.newvar')} value="${val(n+'.newvar')}" placeholder="add a variant + Enter" data-enter="varAdd" data-ns="${esc(n)}"></div>
    ${sug.length?`<div class="sugg">${sug.slice(0,8).map(v=>`<button type="button" data-act="varAdd" data-ns="${esc(n)}" data-v="${esc(v)}">+ ${esc(v)}</button>`).join('')}</div>`:''}</div>
   <div class="grid2"><label class="f">Minimum trials per variant<input type="number" min="1" ${bind(n+'.min')} value="${esc(f.min)}"></label>
    <label class="f">Design<select ${bind(n+'.design')}>${S.designs.map(d=>`<option ${d===f.design?'selected':''}>${d}</option>`).join('')}</select><span class="hint">${esc(DESIGN_INFO[f.design]||'')}</span></label></div>
   <label class="f">Decision rule<textarea ${bind(n+'.rule')} placeholder="e.g. No chunk from another tenant reaches the context in any variant">${val(n+'.rule')}</textarea></label>

}

function freezeCard(){

     <label class="check"><input type="checkbox" ${bind('freeze.anyway')} ${getF('freeze.anyway',false)?'checked':''}> Freeze anyway (the plan stays at code 2 until they are fixed)</label>`:'<div class="note ok">Everything needed before planning is in place.</div>'}

/* ================= plan board ================= */
const COLS=['FAIL','TODO','UNKNOWN','PASS','EXCLUDED','NOT_APPLICABLE'];
function todoRank(t){const s=sample(t);if(blockedAccess(t))return 6;if(s&&s.ready)return 0;if(t.staged)return 1;if(s)return 2;if(t.activity==='DESIGN'||t.activity==='CONFIG')return 3;return 4;}
function cardHint(t){
  if(t.bucket==='TODO'){
    if(blockedAccess(t))return `<span class="chip unk">${t.scope!=='in_scope'?'out of scope':'access unknown'}</span>`;
    if(t.activity==='DESIGN'||t.activity==='CONFIG')return '<span class="chip todo">review</span>';
    const s=sample(t);if(!s)return '<span class="chip unk">needs protocol</span>';
    if(s.ready)return '<span class="chip ready">ready to decide</span>';
    const need=s.rows.reduce((a,r)=>a+r.need,0),got=s.rows.reduce((a,r)=>a+Math.min(r.got.length,r.need),0);
    return `<span class="chip todo">${got}/${need} trials</span>`;}
  if(t.bucket==='UNKNOWN')return '<span class="chip unk">confirm capabilities</span>';
  if(t.bucket==='PASS'||t.bucket==='FAIL')return `<span class="chip">${esc(t.reviewer)}</span>`;
  return '';
}
function miniBar(t){const s=sample(t);if(!s||t.result)return '';const cells=[];
  s.rows.forEach(r=>{for(let i=0;i<r.need;i++){const x=r.got[i];cells.push(x?(x.result==='FAIL'?'f':x._st?'st':'ok'):'');}});
  return `<div class="mini">${cells.map(c=>`<i class="${c}"></i>`).join('')}</div>`;}
function boardView(){
  if(!plan())return `<div class="empty card">${S.mojo['2']}<h2>No frozen plan yet</h2><p style="margin:8px auto 16px;max-width:60ch">The board appears once the architecture is frozen into a plan. Answer what is pending on the right, then freeze it.</p>

  const by={};COLS.forEach(k=>by[k]=[]);sel.forEach(t=>by[t.bucket].push(t));
  by.TODO.sort((a,b)=>todoRank(a)-todoRank(b)||a.case_id.localeCompare(b.case_id));
  const cols=COLS.filter(k=>k==='NOT_APPLICABLE'?UI.showNA:k==='EXCLUDED'?by[k].length:true);
  const c=counts();
  return `<div class="toolbar"><input type="search" id="boardq" placeholder="Search tasks  ( / )" value="${esc(UI.q)}" data-filter="q" aria-label="Search tasks">
   <select data-filter="module" aria-label="Module"><option value="">All modules</option>${mods.map(m=>`<option ${m===UI.module?'selected':''}>${esc(m)}</option>`).join('')}</select>
   <select data-filter="activity" aria-label="Activity"><option value="">All activities</option>${acts.map(m=>`<option ${m===UI.activity?'selected':''}>${esc(m)}</option>`).join('')}</select>
   <label class="check small"><input type="checkbox" data-act="toggleNA" ${UI.showNA?'checked':''}> Show not applicable (${c.NOT_APPLICABLE})</label>
   <span class="grow"></span><span class="small muted">${sel.length} of ${all.length} tasks · ${esc(plan().series)}</span></div>
   ${plan().stale?'<div class="note warn" style="margin-bottom:12px">The architecture changed after this plan was frozen. The board shows the frozen plan; freeze a revision to apply the changes.</div>':''}
   ${ST.integrity_error?`<div class="note bad" style="margin-bottom:12px"><b>The plan does not verify:</b> ${esc(ST.integrity_error)}</div>`:''}
   <div class="cols" style="--n:${cols.length}">${cols.map(k=>`<section class="col ${k}" aria-label="${esc(S.state_meta[k][0])}"><div class="col-h"><span>${esc(S.state_meta[k][0])}</span><span class="n">${by[k].length}</span></div>
     <div class="col-d">${esc(S.state_meta[k][1])}</div><div class="col-b">${colCards(k,by[k])}</div></section>`).join('')}</div>`;

function colCards(k,list){
  const lim=UI['lim_'+k]||60;

  return (html||'<p class="small faint" style="padding:6px">Nothing here.</p>')+(list.length>lim?`<button type="button" class="more" data-act="more" data-col="${k}">Show ${list.length-lim} more</button>`:'');

   ${opt.length?`<div class="sugg">${opt.map(k=>`<button type="button" data-act="evExtra" data-ns="${esc(n)}" data-kind="${esc(k)}">+ ${esc(k)}</button>`).join('')}</div>`:''}
   <p class="tiny faint">Files are hashed (SHA-256) in your browser, hashed again on arrival and copied into the workspace evidence store. You can drop several files on the grid at once; names that contain a kind (e.g. <code>response.json</code>) go to that slot.</p>`;}
function evPayload(n,kinds){const f=ns(n),ev=f.ev||{},files=[],notes=[];

function evHas(n,k){const f=ns(n);return !!(f.ev&&f.ev[k]&&f.ev[k].sha)||!!String(getF(n+'.note_'+k,'')).trim();}

/* ================= rail: status + pending ================= */
function pending(){
  const L=[], w=ST.workspace, p=plan(), cli=s=>s;
  if(!w)return L;
  if(!p){
    ST.setup_items.forEach(i=>L.push({lv:i.blocking?'block':'warn',t:S.items[i.key].label+(i.route?' ('+i.route+')':''),d:S.items[i.key].why,go:['arch',fieldFor(i.key)],route:i.route,cli:i.command}));
    if(!ST.setup_items.some(i=>i.blocking))L.push({lv:'go',t:'Freeze the plan',d:'Turn the architecture into a fixed list of obligations.',go:['arch','sec-freeze'],cli:'merestone plan'});
    return L;}
  if(ST.integrity_error)L.push({lv:'block',t:'The plan does not verify',d:ST.integrity_error,go:['log',null],cli:'merestone doctor'});
  if(p.stale)L.push({lv:'warn',t:'Freeze a revision',d:'The architecture changed after '+w.series+' was frozen.',go:['arch','sec-freeze'],cli:'merestone plan --reason "..." --approver "..."'});
  const gaps=ST.check?ST.check.readiness_gaps:[];
  gaps.forEach(g=>{const cap=g.includes(':evidence:');L.push({lv:'block',t:cap?'Source missing: '+g.split(':evidence:')[1]:(S.gap_label[g]||g),d:'Readiness gap in the frozen plan: fix it, then freeze a revision.',go:['arch',cap?'fld-caps-source':fieldFor(gapKey(g))],cli:cap?'merestone caps NAME=STATE --source "..."':'merestone status'});});
  p.routes.filter(r=>r.access==='unknown'||r.access==='none').forEach(r=>L.push({lv:'block',t:'Access unknown on '+r.id,d:'Tasks cannot complete while access is unknown.',go:['arch','fld-access'],cli:'merestone set access gray-box --route '+r.id}));
  const ts=tasks();
  ts.filter(t=>{const s=sample(t);return s&&s.ready&&!t.result;}).forEach(t=>L.push({lv:'go',t:'Decide '+t.alias,d:t.title+': staged trials are ready.',task:t.alias,cli:`merestone decide ${t.alias} --reviewer "..." --observations "..." --cleanup-confirmed`}));
  ts.filter(t=>t.staged&&!t.result&&!(sample(t)||{}).ready).forEach(t=>L.push({lv:'info',t:'Finish the sample of '+t.alias,d:'Staged trials wait for the rest of the planned sample.',task:t.alias,cli:'merestone show '+t.alias}));
  const unk=ts.filter(t=>t.bucket==='UNKNOWN').length;
  if(unk)L.push({lv:'warn',t:unk+' tasks pending confirmation',d:'They depend on capabilities nobody has verified.',go:['arch','sec-caps'],cli:'merestone caps'});
  const todo=ts.filter(t=>t.bucket==='TODO'&&!blockedAccess(t));
  const np=todo.filter(t=>(t.activity==='TEST'||t.activity==='REDTEAM')&&!t.test_protocol);
  if(np.length)L.push({lv:'warn',t:np.length+' tests without a protocol',d:'e.g. '+np[0].alias+'. Needed to decide PASS or FAIL.',task:np[0].alias,cli:'merestone protocol '+np[0].case_id+' --variants ... --rule ... --why ...'});
  const rv=todo.filter(t=>t.activity==='DESIGN'||t.activity==='CONFIG');
  if(rv.length)L.push({lv:'info',t:rv.length+(rv.length===1?' review':' reviews')+' to do',d:'Next: '+rv[0].alias+' · '+rv[0].title,task:rv[0].alias,cli:'merestone show '+rv[0].alias});
  const rt=todo.filter(t=>t.test_protocol&&!t.staged);
  if(rt.length)L.push({lv:'info',t:rt.length+(rt.length===1?' test':' tests')+' ready to run',d:'Next: '+rt[0].alias+' · '+rt[0].title,task:rt[0].alias,cli:'merestone show '+rt[0].alias});
  ts.filter(t=>t.result==='FAIL').forEach(t=>L.push({lv:'info',t:'Document the finding for '+t.alias,d:'Use templates/finding-v3.json; include it in the report with --findings.',task:t.alias,cli:'python governance.py check-finding ...'}));
  if(code()!==2)L.push({lv:'go',t:'Export the final report',d:'Everything selected is resolved.',exp:true,cli:'merestone report --format both'});
  else L.push({lv:'info',t:'Share progress',d:'Export the report for people who do not use the terminal.',exp:true,cli:'merestone report --format html --open'});
  return L;
}
function gapKey(g){return({authorization_ref:'authorization',snapshot_ref:'snapshot',evidence_store:'evidence-store','inventory_review.reviewer':'reviewer','inventory_review.reviewed_at':'reviewer','inventory_review.evidence_ref':'inventory-evidence',stop_conditions:'stop',limits:'limits',core_design_missing:'activities'})[g]||g;}
function fieldFor(k){return({access:'fld-access',actor:'fld-actor',boundary:'fld-boundary',activities:'fld-activities','caps-source':'fld-caps-source'})[k]||'fld-'+k;}

  allPend:()=>{UI.allPend=!UI.allPend;renderRail();},

  evPick:el=>{const p=$('#filepick');p.onchange=()=>{if(p.files[0])addFile(el.dataset.ns,el.dataset.kind,p.files[0]);p.value='';};p.click();},

  record:async el=>{const t=findTask(el.dataset.task),n='rec:'+t.alias,f=ns(n);const kinds=[...S.tech_kinds,...(f.extra||[])];
    const body={task:t.alias,variant:f.variant,result:f.result,execution:f.execution,expected:f.expected,observed:f.observed,identity:f.identity,reachability:f.reachability,
      blocking_control:f.reachability==='blocked_by_control'?f.blocking_control:'',technique:f.reachability==='blocked_by_control'?'':f.technique,
      example:f.src==='example'?f.example:'',adaptation:f.src==='own'?f.adaptation:'',baseline_failed:!!f.baseline_failed,rationale:f.rationale,parameters:f.parameters,
      collector:f.collector,classification:f.classification,trial_id:f.trial_id,...evPayload(n,kinds)};
    if(f.identity)store.set('identity',f.identity);if(f.collector)store.set('collector',f.collector);

      delete F[n];const t2=findTask(t.alias);const s=t2&&sample(t2);if(s){const nx=(s.rows.find(x=>x.got.length<x.need)||s.rows[0]).v;F[n]={variant:nx,result:'PASS',execution:'completed',...keep};}render();}},
  decide:async el=>{const t=findTask(el.dataset.task),n='dec:'+t.alias,f=ns(n);
    if(!f.cleanup_confirmed){toast('Confirm that test data and state were cleaned up.','','err');return;}if(!String(f.observations||'').trim()||!String(f.reviewer||'').trim()){toast('Reviewer and observations are required.','','err');return;}
    store.set('reviewer',f.reviewer);const r=await act('decide',{task:t.alias,reviewer:f.reviewer,observations:f.observations,cleanup_confirmed:true,inconclusive:!!f.inconclusive});if(r){delete F[n];delete F['rec:'+t.alias];render();}},
  review:async el=>{const t=findTask(el.dataset.task),n='rev:'+t.alias,f=ns(n);const kinds=['review',...(f.extra||[])];
    if(!evHas(n,'review')){toast('Add the review evidence: a file or a short note.','','err');return;}if(!String(f.observations||'').trim()||!String(f.reviewer||'').trim()){toast('Reviewer and observations are required.','','err');return;}
    store.set('reviewer',f.reviewer);const r=await act('review',{task:t.alias,result:f.result,reviewer:f.reviewer,observations:f.observations,collector:f.collector,...evPayload(n,kinds)});if(r){delete F[n];render();}},
  expSet:el=>{setF('exp.'+el.dataset.k,el.dataset.v);exportModal();},
  doExport:async()=>{const fmt=getF('exp.format','html'),lay=getF('exp.layout','board');const win=fmt!=='md'?window.open('','_blank'):null;
    const r=await act('report',{format:fmt,layout:lay},'Report written');
    if(!r){if(win)win.close();return;}
    const html=(r.files||[]).find(x=>x.endsWith('.html')),md=(r.files||[]).find(x=>x.endsWith('.md'));
    const target=html||md;if(win&&target)win.location.href='/reports/'+encodeURIComponent(target);else if(target)window.open('/reports/'+encodeURIComponent(target),'_blank','noopener');
    exportModal();},
};

/* ================= files: hashing and drag & drop ================= */
const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256js(buf){ // fallback when crypto.subtle is unavailable
  const b=new Uint8Array(buf),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=0x80;const dv=new DataView(m.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l/0x20000000));
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),w=new Uint32Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
    let [a,bb,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;}
    H[0]+=a;H[1]+=bb;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h;}
  return [...H].map(x=>x.toString(16).padStart(8,'0')).join('');}
async function sha256(buf){if(window.crypto&&crypto.subtle){const d=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');}return sha256js(buf);}
function b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
async function addFile(n,kind,file){
  if(file.size>40*1024*1024){toast(file.name+' is larger than 40 MB.','Store large captures elsewhere and record a short note or an extract that points to them.','err');return;}
  const f=ns(n);f.ev=f.ev||{};f.ev[kind]={name:file.name,size:file.size};render();
  try{const buf=await file.arrayBuffer();const sha=await sha256(buf);f.ev[kind]={name:file.name,size:file.size,sha,data:b64(buf)};}
  catch(e){delete f.ev[kind];toast('Could not read '+file.name,e.message,'err');}
  render();
}
function guessKind(name,free,all){const low=name.toLowerCase();return all.find(k=>low.includes(k)&&free.includes(k))||free[0];}
document.addEventListener('dragover',e=>{e.preventDefault();const s=e.target.closest&&e.target.closest('.ev, .evgrid');$$('.drag').forEach(x=>{if(x!==s)x.classList.remove('drag');});if(s)s.classList.add('drag');});
document.addEventListener('dragleave',e=>{if(e.target.classList&&e.target.classList.contains('drag'))e.target.classList.remove('drag');});
document.addEventListener('drop',e=>{e.preventDefault();$$('.drag').forEach(x=>x.classList.remove('drag'));
  const files=[...(e.dataTransfer&&e.dataTransfer.files||[])];if(!files.length)return;
  const slot=e.target.closest&&e.target.closest('.ev'), grid=e.target.closest&&e.target.closest('.evgrid');
  if(slot&&files.length===1){addFile(slot.dataset.ns,slot.dataset.evslot,files[0]);return;}
  if(!grid&&!slot){toast('Drop evidence files on the evidence area of a trial or review.','','warn');return;}
  const n=(grid||slot.closest('.evgrid')).dataset.evgrid,f=ns(n);f.ev=f.ev||{};
  const all=$$('.ev',grid||slot.closest('.evgrid')).map(x=>x.dataset.evslot);
  for(const file of files){const free=all.filter(k=>!(f.ev[k])&&!String(getF(n+'.note_'+k,'')).trim());if(!free.length){toast('Every evidence slot is filled.','','warn');break;}
    const k=guessKind(file.name,free,all);f.ev[k]={name:file.name,size:file.size};addFile(n,k,file);}
});

/* ================= events ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=A[el.dataset.act];if(!fn)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'){fn(el,e);return;}e.preventDefault();fn(el,e);});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.bind){setF(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);
    const m=el.dataset.bind.match(/^(route:[^.]+)\.hop(\d+)$/);if(m){F[m[1]].hops[+m[2]]=el.value;}
    if(el.tagName==='SELECT'||el.type==='checkbox'||/\.(variant|reachability|case|design)$/.test(el.dataset.bind)||m||/^(rd|lim|freeze|route:[^.]+)\./.test(el.dataset.bind)||/\.note_/.test(el.dataset.bind)||/^(rec|dec|rev):/.test(el.dataset.bind))schedule();
    return;}
  if(el.dataset.filter){UI[el.dataset.filter]=el.value;schedule();}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.filter){UI[el.dataset.filter]=el.value;render();}});
let tm=null;function schedule(){clearTimeout(tm);tm=setTimeout(render,120);}
document.addEventListener('keydown',e=>{
  const el=e.target, typing=el.matches&&el.matches('input,textarea,select');
  if(e.key==='Enter'&&el.dataset&&el.dataset.enter&&!e.shiftKey){e.preventDefault();const fn=A[el.dataset.enter];if(fn)fn(el);return;}
  if(e.key==='Enter'&&el.dataset&&el.dataset.save==='name'){e.preventDefault();el.blur();return;}
  if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else if(UI.drawer)closeDrawer();else document.body.classList.remove('rail-open');return;}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'&&ST&&ST.workspace){e.preventDefault();if(UI.view!=='plan'){UI.view='plan';render();}const q=$('#boardq');if(q)q.focus();}
  else if(['1','2','3'].includes(e.key)&&ST&&ST.workspace){A.view({dataset:{v:['arch','plan','log'][+e.key-1]}});}
  else if(e.key==='e'||e.key==='E')A.export();else if(e.key==='t'||e.key==='T')A.theme();else if(e.key==='?')helpModal();else if(e.key==='p'||e.key==='P')A.rail();
});
document.addEventListener('focusout',async e=>{const el=e.target;if(el.dataset&&el.dataset.save==='name'){const v=el.value.trim();if(v&&v!==ST.arch.system_name){const r=await act('set',{field:'name',value:v},'System name saved');if(r)delete F.sys;}}});
function applyTheme(){const h=document.documentElement;if(UI.theme==='system')h.removeAttribute('data-theme');else h.dataset.theme=UI.theme;}

/* ================= start ================= */
(async function(){
  applyTheme();if(store.get('cli',false))document.body.classList.add('show-cli');
  try{S=await api('static');await refresh();}catch(e){$('#main').innerHTML=`<div class="empty"><h2>Could not load the workspace</h2><p>${esc(e.message)}</p><p class="small">${esc(e.hint||'')}</p></div>`;return;}
  setInterval(async()=>{if(document.hidden||UI.busy)return;try{const {rev}=await api('rev');if(ST&&rev!==ST.rev)await refresh();}catch(e){}},2500);
  setInterval(()=>{if(UI.view==='log'&&!document.hidden&&!UI.busy)renderMain();},60000);
})();
